{% if page.comments != false and site.giscus %}
  <section id='comment-wrapper' class='no-print sector-wrapper comment-wrapper' aria-labelledby='comment-title'
    data-theme-light='{{ "/assets/style/giscus_light.css" | relative_url }}?v={{ site.time | date: "%s" }}'
    data-theme-dark='{{ "/assets/style/giscus_dark.css" | relative_url }}?v={{ site.time | date: "%s" }}'>
    <h2 id='comment-title' class='sector__title comment__title'>评论</h2>
    {%- if jekyll.environment == 'production' or site.dev_mode -%}
      <div class='comment-status' role='status' aria-live='polite'>
        <span class='comment-status-text'>评论将在此处加载。</span>
        <button type='button' class='component-retry' hidden>重新加载评论</button>
        <a class='comment-fallback' href='https://github.com/{{ site.giscus.data-repo }}/discussions' target='_blank' rel='noopener noreferrer' hidden>前往 GitHub 讨论区</a>
      </div>
      <div class='giscus'></div>
      <template id='comment-config'>
      <script
        data-giscus-loader
        src='https://giscus.app/client.js'
        data-repo='{{ site.giscus.data-repo }}'
        data-repo-id='{{ site.giscus.data-repo-id }}'
        data-category='Comments'
        data-category-id='{{ site.giscus.data-category-id }}'
        data-mapping='title'
        data-strict='0'
        data-reactions-enabled='0'
        data-emit-metadata='0'
        data-input-position='top'
        data-lang='{{ site.lang | default: "zh-CN" }}'
        data-loading='eager'
        crossorigin='anonymous'
        async
      ></script>
      </template>
      <script defer src='{{ "/assets/js/comments.js" | relative_url }}'></script>
      <noscript><p class='comment__content--draft'>启用 JavaScript 后可查看评论，也可<a href='https://github.com/{{ site.giscus.data-repo }}/discussions'>前往 GitHub 讨论区</a>。</p></noscript>
    {%- else -%}
      <div class='no-select sector__content--draft comment__content--draft'>
        本地预览暂不加载评论。
      </div>
    {%- endif -%}
  </section>
{% endif %}
