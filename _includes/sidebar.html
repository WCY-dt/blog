<button type='button' id='back-to-top' class='back-to-top no-print' aria-label='返回顶部' title='返回顶部' hidden><span aria-hidden='true'>{% include arrow.html direction='up' %}</span></button>
<dialog id='search-dialog' class='search-dialog no-print' aria-labelledby='search-title'>
  <div class='search-dialog-heading'><h2 id='search-title'>搜索文章</h2><button type='button' class='search-close' aria-label='关闭搜索'><span aria-hidden='true'>×</span></button></div>
  <div class='search-field'><svg class='search-field-icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' aria-hidden='true'><circle cx='10.5' cy='10.5' r='6.5'/><path d='m15.5 15.5 5 5'/></svg><input type='search' id='search-input' placeholder='搜索文章、关键词…' aria-label='搜索文章、关键词' autocomplete='off' spellcheck='false'><kbd>ESC</kbd></div>
  <p id='search-status' class='search-status' role='status'>输入关键词，搜索文章标题、标签与正文。</p>
  <ul id='search-results' class='search-results'></ul>
  <div class='search-hint'><span>{% include arrow.html direction='up' %} {% include arrow.html direction='down' %} 选择 · Enter 打开 · Esc 关闭</span></div>
</dialog>
<script src='{{ "/assets/js/theme.js" | relative_url }}'></script>
<script src='{{ "/assets/js/search.js" | relative_url }}'></script>
<script src='{{ "/assets/js/back_to_top.js" | relative_url }}'></script>


{% if page.layout == 'post' %}<script src='{{ "/assets/js/toc.js" | relative_url }}'></script>{% endif %}
