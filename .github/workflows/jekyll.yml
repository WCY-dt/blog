name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Modify Gemfile
        run: sed -i 's/https:\/\/gems.ruby-china.com/https:\/\/rubygems.org/g' Gemfile
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Setup Node for website posts
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache website builds and dependencies
        uses: actions/cache@v4
        with:
          path: .jekyll-cache/website-posts
          key: websites-${{ runner.os }}-node24-${{ hashFiles('assets/post/websites/**', '_posts/**', '_plugins/website.rb', '_config.yml') }}
          restore-keys: |
            websites-${{ runner.os }}-node24-
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
